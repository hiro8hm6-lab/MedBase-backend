name: Backend checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: medbase
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: medbase_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U medbase -d medbase_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql+psycopg://medbase:test-password@localhost:5432/medbase_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.9.2
          python-version: '3.13'
          enable-cache: true
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest -q
  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.9.2
          python-version: '3.13'
      - run: uv sync --frozen
      - run: docker compose -f compose.yaml -f compose.mock.yaml up -d --build --wait
      - run: uv run python scripts/smoke.py
      - name: Verify persistence across restart
        run: |
          docker compose -f compose.yaml -f compose.mock.yaml restart api worker
          uv run python scripts/check_persistence.py
      - if: failure()
        run: docker compose -f compose.yaml -f compose.mock.yaml logs --no-color
      - if: always()
        run: docker compose -f compose.yaml -f compose.mock.yaml down -v
