[project]
name = "medbase-backend"
version = "0.1.0"
description = "Docker-based medical exam PDF processing API"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.14,<2",
  "psycopg[binary]>=3.2,<4",
  "python-multipart>=0.0.20,<1",
  "pypdf>=6.0,<7",
  "fonttools>=4.55,<5",
  "pillow>=11,<13",
  "pillow-heif>=0.21,<2",
  "img2pdf>=0.6,<1",
  "google-genai>=1.60,<3",
  "jsonschema>=4.23,<5",
  "httpx>=0.28,<1",
  "tzdata>=2025.1",
]

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1", "reportlab>=4.3,<5"]

[project.scripts]
medbase = "medbase.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/medbase"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["postgres: requires a PostgreSQL database", "live: requires Gemini API and user PDFs"]

[tool.ruff]
target-version = "py313"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
